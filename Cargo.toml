[package]
name = "rust-starterkit"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = { version = "4.13.0", features = ["macros"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
chrono = { version = "0.4.44", features = ["serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "time"] }
tracing-actix-web = "0.7.21"
tracing-appender = "0.2.5"
uuid = { version = "1.23.1", features = ["v4", "v7", "serde", "fast-rng"] }
dotenvy = "0.15.7"
thiserror = "2.0.18"
futures-util = "0.3.32"
config = "0.15.23"
duration-str = "0.21.0"
anyhow = "1.0.102"
pasetors = "0.7.8"
hex = "0.4.3"
sea-orm = { version = "2.0.0-rc", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "debug-print"] }
argon2 = "0.5.3"
