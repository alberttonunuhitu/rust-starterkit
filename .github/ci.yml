name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"
  RUST_BACKTRACE: 1

jobs:
  quality:
    name: Rust quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            src/infrastructure/database/migrations
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (api)
        run: cargo clippy --all-targets -- -D warnings
      - name: Build release (api)
        run: cargo build --release --bin api
      - name: Build release (migration)
        run: cargo build --release --manifest-path src/infrastructure/database/migrations/Cargo.toml
      - name: Build generate-paseto-keys
        run: cargo build --release --bin generate-paseto-keys