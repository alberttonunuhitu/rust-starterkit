name: rust-starterkit

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-api-env: &api-env
  APP_SERVER__HOST: "0.0.0.0"
  APP_SERVER__PORT: "8080"
  APP_DATABASE__URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
  APP_DATABASE__MAX_CONNECTIONS: "15"
  APP_DATABASE__MIN_CONNECTIONS: "2"
  APP_DATABASE__CONNECT_TIMEOUT: "10"
  APP_DATABASE__ACQUIRE_TIMEOUT: "8"
  APP_DATABASE__IDLE_TIMEOUT: "300"
  APP_DATABASE__MAX_LIFETIME: "1800"
  APP_TOKEN__SECRET_KEY: ${APP_TOKEN__SECRET_KEY:?set APP_TOKEN__SECRET_KEY}
  APP_TOKEN__REFRESH_SECRET_KEY: ${APP_TOKEN__REFRESH_SECRET_KEY:?set APP_TOKEN__REFRESH_SECRET_KEY}
  APP_TOKEN__EXPIRATION: ${APP_TOKEN__EXPIRATION:-15m}
  APP_TOKEN__REFRESH_EXPIRATION: ${APP_TOKEN__REFRESH_EXPIRATION:-7d}
  APP_TOKEN__ISSUER: ${APP_TOKEN__ISSUER:-rust}
  APP_TOKEN__AUDIENCE: ${APP_TOKEN__AUDIENCE:-vue}
  APP_APP__ENVIRONMENT: ${APP_APP__ENVIRONMENT:-production}
  RUST_LOG: ${RUST_LOG:-info}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-rust_starterkit}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "5432:5432"
    profiles:
      - dev
    deploy:
      resources:
        limits:
          memory: 512M
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /run

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    logging: *default-logging
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    command: ["up"]
    profiles:
      - dev
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    logging: *default-logging
    environment:
      <<: *api-env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - backend
    ports:
      -  "${API_HOST:-127.0.0.1}:${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    profiles:
      - dev
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

networks:
  backend:
    driver: bridge
    internal: false

volumes:
  postgres_data:
    driver: local